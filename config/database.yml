default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # host: <%= ENV.fetch("DB_HOST", "localhost") %>
  # port: <%= ENV.fetch("DB_PORT", 5432) %>
  # username: rails
  # password: rails
  database: <%= ENV["POSTGRES_DATABASE"] %>
  username: <%= ENV["POSTGRES_USERNAME"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  host: <%= ENV["POSTGRES_HOST"] %>

development:
  primary:
    <<: *default
    database: bevyhr_development
  queue:
    <<: *default
    database: bevyhr_development_queue

test:
  <<: *default
  database: bevyhr_test

# Store production database in PostgreSQL
production:
  primary: &production_primary
    <<: *default
    database: <%= ENV["POSTGRES_DB"] %>
    username: <%= ENV["POSTGRES_USER"] %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>
  cache: &production_cache
    <<: *default
    database: bevyhr_production_cache
  queue: &production_queue
    <<: *default
    database: bevyhr_production_queue
  cable: &production_cable
    <<: *default
    database: bevyhr_production_cable
