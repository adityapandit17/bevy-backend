<% require "dotenv"; Dotenv.load(".env"); %>

# Name of your application. Used to uniquely configure containers.
service: bevyhr_backend

# Name of the container image.
image: bevyhr/bevyhr_backend

# Deploy to these servers.
servers:
  web:
    - 122.185.46.118
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  host: api.bevyhr.com
  # Proxy connects to your container on port 80 by default.
  app_port: 3000
  # Keep WebSocket (/cable) connections alive for Action Cable
  response_timeout: 86400

# Credentials for your image host.
registry:
  # Specify the registry server, if you're not using Docker Hub
  # server: registry.digitalocean.com / ghcr.io / ...
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD
  server: localhost:5555

retain_containers: 2

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    # - POSTGRES_USERNAME
    - POSTGRES_PASSWORD
    - TURN_CREDENTIAL
    # - POSTGRES_HOST
    # - POSTGRES_DATABASE
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true
    POSTGRES_USER: "bevyhr"
    POSTGRES_DB: "bevyhr_production"
    DB_HOST: bevyhr_backend-postgres
    FRONTEND_URL: https://bevyhr.com
    FRONTEND_DOMAIN: bevyhr.com
    CABLE_URL: wss://api.bevyhr.com/cable
    ACTION_CABLE_ALLOWED_ORIGINS: https://bevyhr.com,https://www.bevyhr.com
    TURN_URLS: turn:122.185.46.118:3478?transport=udp,turn:122.185.46.118:3478?transport=tcp
    TURN_USERNAME: bevyhr
    MAILER_DEFAULT_FROM: BevyHR <no-reply@bevyhr.com>

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use hrms_backend-db for a db accessory server on same machine via local kamal docker network.
    # POSTGRES_USERNAME: <%= ENV["POSTGRES_USERNAME"] %>
    # POSTGRES_PASSWORD: <%= ENV["POSTGRES_PASSWORD"] %>
    # POSTGRES_HOST: <%= ENV["POSTGRES_HOST"] %>
    # POSTGRES_DATABASE: <%= ENV["POSTGRES_DATABASE"] %>

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"


# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "hrms_backend_storage:/rails/storage"


# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: 3.4.4
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
ssh:
  port: 2233
  user: b902dc
  keys: [~/.ssh/bestserver]

# Use accessory services (secrets come from .kamal/secrets).
# accessories:
#   db:
#     image: mysql:8.0
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
#     port: "127.0.0.1:3306:3306"
#     env:
#       clear:
#         MYSQL_ROOT_HOST: '%'
#       secret:
#         - MYSQL_ROOT_PASSWORD
#     files:
#       - config/mysql/production.cnf:/etc/mysql/my.cnf
#       - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
#     directories:
#       - data:/var/lib/mysql
#   redis:
#     image: redis:7.0
#     host: 192.168.0.2
#     port: 6379
#     directories:
#       - data:/data

accessories:
  postgres:
    image: postgres:17
    host: 122.185.46.118
    env:
      clear:
        POSTGRES_USER: "bevyhr"
        POSTGRES_DB: "bevyhr_production"
      secret:
        - POSTGRES_PASSWORD
    files:
      - db/production_setup.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - data:/var/lib/postgresql/data

  coturn:
    image: coturn/coturn:4.6.2-alpine
    host: 122.185.46.118
    port: "3478:3478"
    env:
      secret:
        - TURN_CREDENTIAL
    options:
      entrypoint: /bin/sh
      publish:
        - "3478:3478/udp"
    cmd: -c "exec turnserver -n --listening-port=3478 --fingerprint --lt-cred-mech --realm=bevyhr.com --user=bevyhr:$$TURN_CREDENTIAL --no-cli --log-file=stdout --no-multicast-peers"